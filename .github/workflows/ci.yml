name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-ci-${{ hashFiles('Cargo.lock') }}

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      # The agent's own tests: what it blanks in master config files, and
      # its event listener. Python 3.10 is what Salt's packages ship.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Agent tests
        run: |
          python -m pip install --quiet pyyaml
          python -m unittest discover -s agent/tests -v
