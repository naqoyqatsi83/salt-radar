name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Determine version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "VERSION_STRIPPED=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          else
            V=$(cargo metadata --format-version=1 --no-deps | jq -r '.packages[0].version')
            echo "VERSION_STRIPPED=$V" >> $GITHUB_ENV
          fi

      - name: Prepare upload dir
        run: mkdir -p ${{ runner.temp }}/upload

      - name: Build release (x86_64-unknown-linux-musl)
        env:
          CARGO_NET_RETRY: 5
          CARGO_HTTP_TIMEOUT: 120
        run: |
          # Static musl build: zero glibc dependency, so it runs unmodified on
          # any x86_64 Linux regardless of the target distro's libc version.
          # Built directly on the runner (it ships rustup) rather than in a
          # Docker image, so a Docker Hub outage can't block a release.
          set -e
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools > /dev/null
          for i in 1 2 3; do
            cargo build --release --target x86_64-unknown-linux-musl && break
            echo "Build attempt $i failed, retrying..."
            sleep 5
            if [ "$i" = 3 ]; then
              echo "All 3 build attempts failed!"
              exit 1
            fi
          done

      - name: Create .deb package (amd64)
        run: |
          VERSION="$VERSION_STRIPPED"
          DPKG_VERSION="${VERSION/-rc/~rc}"
          BINARY="${{ github.workspace }}/target/x86_64-unknown-linux-musl/release/salt-radar"
          PKG_ROOT="${{ runner.temp }}/deb/salt-radar_${DPKG_VERSION}_amd64"

          mkdir -p "$PKG_ROOT/DEBIAN"
          mkdir -p "$PKG_ROOT/usr/bin"
          mkdir -p "$PKG_ROOT/usr/share/salt-radar"
          mkdir -p "$PKG_ROOT/usr/share/doc/salt-radar"

          install -m 0755 "$BINARY" "$PKG_ROOT/usr/bin/salt-radar"
          install -m 0644 "${{ github.workspace }}/agent/salt_radar_agent.py" "$PKG_ROOT/usr/share/salt-radar/salt_radar_agent.py"
          install -d "$PKG_ROOT/usr/share/salt-radar/themes"
          install -m 0644 "${{ github.workspace }}"/themes/*.theme "$PKG_ROOT/usr/share/salt-radar/themes/"
          cp "${{ github.workspace }}/LICENSE" "$PKG_ROOT/usr/share/doc/salt-radar/" 2>/dev/null || true
          cp "${{ github.workspace }}/README.md" "$PKG_ROOT/usr/share/doc/salt-radar/"
          cp "${{ github.workspace }}/CHANGELOG.md" "$PKG_ROOT/usr/share/doc/salt-radar/"

          {
            printf 'Package: salt-radar\n'
            printf 'Version: %s\n' "$DPKG_VERSION"
            printf 'Section: admin\n'
            printf 'Priority: optional\n'
            printf 'Architecture: amd64\n'
            printf 'Recommends: python3, salt-master\n'
            printf 'Maintainer: naqoyqatsi83 <naqoyqatsi83@users.noreply.github.com>\n'
            printf 'Description: Non-intrusive read-only TUI for monitoring a Salt Master\n'
            printf ' Real-time monitoring of Salt infrastructure: dashboard, minion fleet,\n'
            printf ' event bus, job tracking, alerts. Uses a bundled Python agent to\n'
            printf ' communicate with Salt APIs via NDJSON over stdin/stdout.\n'
            printf 'Homepage: https://github.com/naqoyqatsi83/salt-radar\n'
          } > "$PKG_ROOT/DEBIAN/control"

          dpkg-deb --build "$PKG_ROOT" "${{ runner.temp }}/deb/salt-radar_${DPKG_VERSION}_amd64.deb"

      - name: Create tarball (x86_64-unknown-linux-musl)
        run: |
          VERSION="$VERSION_STRIPPED"
          TAR_DIR="${{ runner.temp }}/tar"
          mkdir -p "$TAR_DIR/salt-radar-${VERSION}"
          install -m 0755 "${{ github.workspace }}/target/x86_64-unknown-linux-musl/release/salt-radar" "$TAR_DIR/salt-radar-${VERSION}/salt-radar"
          install -m 0644 "${{ github.workspace }}/agent/salt_radar_agent.py" "$TAR_DIR/salt-radar-${VERSION}/salt_radar_agent.py"
          install -d "$TAR_DIR/salt-radar-${VERSION}/themes"
          install -m 0644 "${{ github.workspace }}"/themes/*.theme "$TAR_DIR/salt-radar-${VERSION}/themes/"
          cp "${{ github.workspace }}/README.md" "$TAR_DIR/salt-radar-${VERSION}/" 2>/dev/null || true
          cp "${{ github.workspace }}/CHANGELOG.md" "$TAR_DIR/salt-radar-${VERSION}/"
          cp "${{ github.workspace }}/LICENSE" "$TAR_DIR/salt-radar-${VERSION}/" 2>/dev/null || true
          cd "$TAR_DIR" && tar czf "${{ runner.temp }}/upload/salt-radar-${VERSION}-x86_64-unknown-linux-musl.tar.gz" "salt-radar-${VERSION}"

      - name: Create RPM package
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq rpm

          VERSION="$VERSION_STRIPPED"
          RPM_VERSION="${VERSION/-/_}"
          mkdir -p $HOME/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}

          {
            printf 'Name: salt-radar\n'
            printf 'Version: %s\n' "$RPM_VERSION"
            printf 'Release: 1%%{?dist}\n'
            printf 'Summary: Non-intrusive read-only TUI for monitoring a Salt Master\n'
            printf 'License: MIT\n'
            printf 'URL: https://github.com/naqoyqatsi83/salt-radar\n'
            printf 'Group: Applications/System\n'
            printf 'BuildArch: x86_64\n'
            printf '\n'
            printf '%%description\n'
            printf 'Real-time monitoring of Salt infrastructure: dashboard, minion fleet,\n'
            printf 'event bus, job tracking, alerts. Uses a bundled Python agent to\n'
            printf 'communicate with Salt APIs via NDJSON over stdin/stdout.\n'
            printf '\n'
            printf '%%install\n'
            printf 'mkdir -p %%{buildroot}%%{_bindir}\n'
            printf 'mkdir -p %%{buildroot}%%{_datadir}/salt-radar\n'
            printf 'install -m 0755 %%{_sourcedir}/salt-radar %%{buildroot}%%{_bindir}/salt-radar\n'
            printf 'install -m 0644 %%{_sourcedir}/salt_radar_agent.py %%{buildroot}%%{_datadir}/salt-radar/salt_radar_agent.py\n'
            printf 'mkdir -p %%{buildroot}%%{_datadir}/salt-radar/themes\n'
            printf 'install -m 0644 %%{_sourcedir}/themes/*.theme %%{buildroot}%%{_datadir}/salt-radar/themes/\n'
            printf 'mkdir -p %%{buildroot}%%{_docdir}/salt-radar\n'
            printf 'install -m 0644 %%{_sourcedir}/CHANGELOG.md %%{buildroot}%%{_docdir}/salt-radar/CHANGELOG.md\n'
            printf '\n'
            printf '%%files\n'
            printf '%%{_bindir}/salt-radar\n'
            printf '%%{_datadir}/salt-radar/salt_radar_agent.py\n'
            printf '%%{_datadir}/salt-radar/themes\n'
            printf '%%{_docdir}/salt-radar\n'
            printf '\n'
            printf '%%changelog\n'
            printf '* Thu Jun 18 2026 naqoyqatsi83 <naqoyqatsi83@users.noreply.github.com> - %s\n' "$VERSION"
            printf '%%s\n' '- Initial release'
          } > $HOME/rpmbuild/SPECS/salt-radar.spec

          install -m 0755 "${{ github.workspace }}/target/x86_64-unknown-linux-musl/release/salt-radar" $HOME/rpmbuild/SOURCES/salt-radar
          install -m 0644 "${{ github.workspace }}/agent/salt_radar_agent.py" $HOME/rpmbuild/SOURCES/salt_radar_agent.py
          install -d $HOME/rpmbuild/SOURCES/themes
          install -m 0644 "${{ github.workspace }}"/themes/*.theme $HOME/rpmbuild/SOURCES/themes/
          install -m 0644 "${{ github.workspace }}/CHANGELOG.md" $HOME/rpmbuild/SOURCES/CHANGELOG.md

          rpmbuild -ba $HOME/rpmbuild/SPECS/salt-radar.spec
          cp $HOME/rpmbuild/RPMS/x86_64/salt-radar-*.rpm "${{ runner.temp }}/upload/"

      - name: Stage .deb for upload
        run: cp ${{ runner.temp }}/deb/salt-radar_*.deb ${{ runner.temp }}/upload/

      - name: Upload build outputs (manual run, no release)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v5
        with:
          name: salt-radar-all-artifacts
          path: ${{ runner.temp }}/upload/
          retention-days: 1

      - name: Create release (tag push only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          name: salt-radar v${{ env.VERSION_STRIPPED }}
          body: |
            ## salt-radar v${{ env.VERSION_STRIPPED }}

            ### Installation
            **Debian/Ubuntu**:
            ```bash
            sudo dpkg -i salt-radar_*_amd64.deb
            ```

            **Fedora/RHEL**:
            ```bash
            sudo rpm -i salt-radar-*.rpm
            ```

            **Other distros**: Download the `.tar.gz` for your arch, extract, and run `./salt-radar`.

            **Build from source**:
            ```bash
            cargo install --git https://github.com/naqoyqatsi83/salt-radar.git
            ```
          files: |
            ${{ runner.temp }}/upload/salt-radar_*.deb
            ${{ runner.temp }}/upload/salt-radar-*.tar.gz
            ${{ runner.temp }}/upload/salt-radar-*.rpm
