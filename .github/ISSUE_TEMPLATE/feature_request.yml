name: Idea
description: Something salt-radar could show or do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want to see or do
      description: The situation on your master and what you'd look for in salt-radar.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: The salt commands or other tools you use for it now, if any.
