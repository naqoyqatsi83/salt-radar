[package]
name = "salt-radar"
version = "0.9.3-rc1"
edition = "2021"
rust-version = "1.88"
description = "A non-intrusive, read-only TUI for monitoring a Salt Master"
license = "MIT"
repository = "https://github.com/naqoyqatsi83/salt-radar"
homepage = "https://github.com/naqoyqatsi83/salt-radar"
readme = "README.md"
keywords = ["salt", "saltstack", "tui", "monitoring", "ratatui"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
toml = { version = "0.8", features = ["preserve_order"] }
base64 = "0.22"
libc = "0.2"
regex = "1"

[lints.clippy]
# The large panel/popup draw functions take their inputs explicitly; bundling
# them into one-off structs just to satisfy the count wouldn't make them clearer.
too_many_arguments = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
