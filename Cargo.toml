[package]
name = "salt-radar"
version = "0.6.3-rc7"
edition = "2021"
description = "A non-intrusive, read-only TUI for monitoring a Salt Master"
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
toml = "0.8"
base64 = "0.22"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
